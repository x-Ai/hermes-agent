name: Fork upstream sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One sync at a time; a newer pending run replaces an older one. This workflow also
# publishes the fork's stable releases (scripts/fork_sync/releases.py), so no other
# workflow moves its tags.
concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository != 'NousResearch/hermes-agent' && github.ref == 'refs/heads/main' && vars.SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    # config.json agent.budget_seconds (100 min) for the merge steps, plus setup, the last step's
    # desktop UI test check (up to 45 min past the budget, scripts/fork_sync/desktop_tests.py) and upload.
    timeout-minutes: 155
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      candidate: ${{ steps.prepare.outputs.candidate }}
      changed: ${{ steps.prepare.outputs.changed }}
      needed: ${{ steps.prepare.outputs.needed }}
      # true while upstream main or a release is still unmerged: publish starts the next run.
      remaining: ${{ steps.prepare.outputs.remaining }}
      # JSON list of Python test shards, [] when the merge reaches no Python test.
      shards: ${{ steps.prepare.outputs.shards }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Pi in the runner temp directory
        env:
          PI_VERSION: '1.5.0'
        run: |
          npm install --prefix "$RUNNER_TEMP/fork-sync-cli" --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          printf '%s/node_modules/.bin\n' "$RUNNER_TEMP/fork-sync-cli" >> "$GITHUB_PATH"
      # The validate job's toolchain and locked JS dependencies, so Pi and the controller's per-step
      # check can run the desktop UI tests (scripts/fork_sync/run.py desktop_tests) instead of merging
      # desktop code blind. PM's Node 26 also runs Pi, which needs 22.19 or newer.
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Keep controller outside the merge tree
        run: cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
      - name: Merge upstream (new release first), resolve conflicts, localize new text, keep fork i18n and features
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_AI_API_KEY: ${{ secrets.SYNC_AI_API_KEY }}
          SYNC_AI_BASE_URL: ${{ vars.SYNC_AI_BASE_URL }}
          SYNC_AI_MODEL: ${{ vars.SYNC_AI_MODEL }}
          SYNC_RELEASES_SINCE: ${{ vars.SYNC_RELEASES_SINCE }}
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" prepare --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - name: Preserve candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
          if-no-files-found: ignore
          retention-days: 7

  validate:
    needs: prepare
    # Nothing to check when the run only publishes releases on main's existing history.
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize the exact candidate
        run: |
          cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" materialize --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate fork behavior and all localization surfaces
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" validate --artifacts "$RUNNER_TEMP/fork-sync-artifacts"

  # The whole Python suite needs about three hours on one hosted runner. Prepare
  # lists the test files the merge can affect (scripts/fork_sync/select_tests.py;
  # dependency locks and conftest changes list them all) and sizes the shards.
  test:
    name: Python tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize the exact candidate
        run: |
          cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" materialize --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - uses: ./.github/actions/setup-pm
        with:
          # Tests that drive scripts/build/node-deps.mjs need pnpm, as in tests.yml.
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      # ubuntu-latest ships neither tool. The search tool and the doctor's PM-store parity probe
      # drive ripgrep (tests.yml installs this same pinned binary); the classic-view chat suites
      # drive real CLIs in tmux, which upstream's Blacksmith image carries.
      - name: Install ripgrep (prebuilt binary)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version
      - name: Install tmux
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: Run this shard of the selected Python tests
        env:
          SHARD: ${{ matrix.shard }}
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" test --shard "$SHARD" --artifacts "$RUNNER_TEMP/fork-sync-artifacts"

  publish:
    needs: [prepare, validate, test]
    # test is skipped, not failed, when the merge reaches no Python test; validate too when
    # the run only publishes releases on main's existing history.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.needed == 'true'
      && (needs.validate.result == 'success'
          || (needs.validate.result == 'skipped' && needs.prepare.outputs.changed != 'true'))
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      # Only trusted source from the triggering fork main is executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Advance main and publish upstream releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          gh auth setup-git
          python scripts/fork_sync/run.py publish --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      # A run that stopped at a release (or ran out of budget) leaves upstream main for the
      # next one; start it now instead of at the next hourly slot. A run that fails or has
      # nothing left publishes nothing here, so this never loops on its own.
      - name: Continue with the rest of upstream
        if: needs.prepare.outputs.remaining == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-upstream-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
