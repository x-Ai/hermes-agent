name: Fork upstream sync

on:
  # Every run starts the next one when it ends (the `next` job), so the sync keeps going on its own.
  # The schedule only restarts that chain if it breaks: GitHub fires a fraction of this repository's
  # scheduled slots (the hourly '7 * * * *' made 7 runs in 37 hours on 2026-11-08/09, most 35-50
  # minutes late; its other scheduled workflows fared no better), and '23,53 * * * *' missed its first
  # slot too. A trigger that lands while a run is in progress waits as the one pending run; a
  # scheduled run after failed runs backs off (scripts/fork_sync/run.py backoff_until).
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: Minutes to wait before merging. The chain sets it; leave 0 to start now.
        required: false
        default: '0'

permissions:
  contents: read

# One sync at a time; a newer pending run replaces an older one. This workflow also
# publishes the fork's stable releases (scripts/fork_sync/releases.py), so no other
# workflow moves its tags.
concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  # A chained run waits here first: not at all after a publish that left upstream with more to
  # merge, 30 minutes after a run that merged nothing, and 30 minutes doubling to 4 hours after
  # failed runs (scripts/fork_sync/run.py next_delay).
  wait:
    if: github.repository != 'NousResearch/hermes-agent' && github.ref == 'refs/heads/main' && vars.SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Wait before merging
        env:
          DELAY: ${{ inputs.delay_minutes || '0' }}
        run: |
          case "$DELAY" in ''|*[!0-9]*) echo "::error::delay_minutes must be a whole number of minutes"; exit 1 ;; esac
          if [ "$DELAY" -gt 0 ]; then echo "Waiting $DELAY minute(s) before merging"; sleep $(( DELAY * 60 )); fi

  prepare:
    needs: wait
    if: github.repository != 'NousResearch/hermes-agent' && github.ref == 'refs/heads/main' && vars.SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    # config.json agent.budget_seconds (100 min) for the merge steps, plus setup, the last step's
    # desktop UI test check (up to 45 min past the budget, scripts/fork_sync/desktop_tests.py) and upload.
    timeout-minutes: 155
    permissions:
      contents: read
      # This workflow's earlier runs, for the failure backoff of scheduled runs.
      actions: read
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      candidate: ${{ steps.prepare.outputs.candidate }}
      changed: ${{ steps.prepare.outputs.changed }}
      needed: ${{ steps.prepare.outputs.needed }}
      # true while upstream main or a release was still unmerged when prepare finished.
      remaining: ${{ steps.prepare.outputs.remaining }}
      # JSON list of Python test shards, [] when the merge reaches no Python test.
      shards: ${{ steps.prepare.outputs.shards }}
      # JSON list of validate lanes.
      lanes: ${{ steps.prepare.outputs.lanes }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Pi in the runner temp directory
        env:
          PI_VERSION: '1.5.0'
        run: |
          npm install --prefix "$RUNNER_TEMP/fork-sync-cli" --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          printf '%s/node_modules/.bin\n' "$RUNNER_TEMP/fork-sync-cli" >> "$GITHUB_PATH"
      # The validate job's toolchain and locked JS dependencies, so Pi and the controller's per-step
      # check can run the desktop UI tests (scripts/fork_sync/run.py desktop_tests) instead of merging
      # desktop code blind. PM's Node 26 also runs Pi, which needs 22.19 or newer.
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Keep controller outside the merge tree
        run: cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
      - name: Merge upstream (new release first), resolve conflicts, localize new text, keep fork i18n and features
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_AI_API_KEY: ${{ secrets.SYNC_AI_API_KEY }}
          SYNC_AI_BASE_URL: ${{ vars.SYNC_AI_BASE_URL }}
          SYNC_AI_MODEL: ${{ vars.SYNC_AI_MODEL }}
          SYNC_RELEASES_SINCE: ${{ vars.SYNC_RELEASES_SINCE }}
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" prepare --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - name: Preserve candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # One lane runs the repository checks, the others split the desktop UI suite (config.json
  # ui_shards; scripts/fork_sync/run.py validation_lanes). One job used to run them in turn:
  # about 5 minutes of checks and 18-33 of UI tests on a 4-vCPU runner.
  validate:
    name: Validate (${{ matrix.lane }})
    needs: prepare
    # Nothing to check when the run only publishes releases on main's existing history.
    if: >-
      needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.changed == 'true'
      && needs.prepare.outputs.lanes != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.lanes) }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize the exact candidate
        run: |
          cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" materialize --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate fork behavior and all localization surfaces
        env:
          LANE: ${{ matrix.lane }}
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" validate --lane "$LANE" --artifacts "$RUNNER_TEMP/fork-sync-artifacts"

  # The whole Python suite needs about three hours on one hosted runner. Prepare
  # lists the test files the merge can affect (scripts/fork_sync/select_tests.py;
  # dependency locks and conftest changes list them all) and sizes the shards.
  test:
    name: Python tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize the exact candidate
        run: |
          cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" materialize --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - uses: ./.github/actions/setup-pm
        with:
          # Tests that drive scripts/build/node-deps.mjs need pnpm, as in tests.yml.
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      # ubuntu-latest ships neither tool. The search tool and the doctor's PM-store parity probe
      # drive ripgrep (tests.yml installs this same pinned binary); the classic-view chat suites
      # drive real CLIs in tmux, which upstream's Blacksmith image carries.
      - name: Install ripgrep (prebuilt binary)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version
      - name: Install tmux
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: Run this shard of the selected Python tests
        env:
          SHARD: ${{ matrix.shard }}
        run: python "$RUNNER_TEMP/fork-sync-controller/run.py" test --shard "$SHARD" --artifacts "$RUNNER_TEMP/fork-sync-artifacts"

  # The fork's own sessions push to main during the two-hour run. When main moved, this job
  # merges it into the validated candidate and re-checks only what the newer commits change on
  # top of it (scripts/fork_sync/reconcile.py), without the write token. A conflict, or a reach
  # beyond one Python test shard, leaves the merge to the next run.
  reconcile:
    needs: [prepare, validate, test]
    # test is skipped, not failed, when the merge reaches no Python test; validate too when
    # the run only publishes releases on main's existing history.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.needed == 'true'
      && (needs.validate.result == 'success'
          || (needs.validate.result == 'skipped' && needs.prepare.outputs.changed != 'true'))
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Isolate Hermes test state
        run: |
          printf 'HERMES_HOME=%s/hermes-sync-home\nHERMES_RUNTIME_DIR=%s/hermes-sync-runtime\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize the exact candidate
        run: |
          cp -R scripts/fork_sync "$RUNNER_TEMP/fork-sync-controller"
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" materialize --artifacts "$RUNNER_TEMP/fork-sync-artifacts"
      - name: Merge a fork main that moved during the run
        id: merge
        run: |
          python3 "$RUNNER_TEMP/fork-sync-controller/run.py" reconcile --artifacts "$RUNNER_TEMP/fork-sync-artifacts" \
            --reconciled "$RUNNER_TEMP/fork-sync-reconciled"
      - if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          archive-inputs: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Install locked frontend dependencies
        if: steps.merge.outputs.merged == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install ripgrep (prebuilt binary)
        if: steps.merge.outputs.merged == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
      - name: Install tmux
        if: steps.merge.outputs.merged == 'true'
        run: command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
      - name: Re-check what the newer main commits change on top of the candidate
        if: steps.merge.outputs.merged == 'true'
        run: |
          python "$RUNNER_TEMP/fork-sync-controller/run.py" recheck --artifacts "$RUNNER_TEMP/fork-sync-artifacts" \
            --reconciled "$RUNNER_TEMP/fork-sync-reconciled"
      - name: Hand the re-checked merge to publish
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-sync-reconciled
          path: ${{ runner.temp }}/fork-sync-reconciled
          retention-days: 7

  publish:
    needs: [prepare, validate, test, reconcile]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.needed == 'true'
      && (needs.validate.result == 'success'
          || (needs.validate.result == 'skipped' && needs.prepare.outputs.changed != 'true'))
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && needs.reconcile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # true when upstream has more to merge: the next run starts without waiting.
      continue: ${{ steps.publish.outputs.continue }}
    permissions:
      contents: write
    steps:
      # Only trusted source from the triggering fork main is executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-candidate
          path: ${{ runner.temp }}/fork-sync-artifacts
      - if: needs.reconcile.outputs.merged == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-sync-reconciled
          path: ${{ runner.temp }}/fork-sync-reconciled
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Advance main and publish upstream releases
        id: publish
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          gh auth setup-git
          python scripts/fork_sync/run.py publish --artifacts "$RUNNER_TEMP/fork-sync-artifacts" \
            --reconciled "$RUNNER_TEMP/fork-sync-reconciled"

  # Start the next run whatever this one did (scripts/fork_sync/run.py chain). It waits before merging
  # according to how this run ended; the dispatch replaces any pending scheduled run, so one chain runs
  # at a time. A cancelled or paused run starts nothing.
  next:
    needs: [prepare, validate, test, reconcile, publish]
    if: >-
      always() && !cancelled() && github.repository != 'NousResearch/hermes-agent'
      && github.ref == 'refs/heads/main' && vars.SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # Only trusted source from the triggering fork main is executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/fork_sync/run.py next --artifacts "$RUNNER_TEMP"
